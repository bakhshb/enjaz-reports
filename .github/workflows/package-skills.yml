# Rebuild the standalone skill zips on every change to main and publish them
# under the fixed "skills-latest" release, so download links never change.
name: Package skills

on:
  push:
    branches: [main]
    paths: ['skills/**', 'tools/package_skills.py']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-skills
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/package_skills.py --outdir dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete skills-latest --cleanup-tag --yes || true
          gh release create skills-latest dist/*.zip \
            --title "Skills (latest)" \
            --notes "Built from ${GITHUB_SHA} on main. Upload a zip in claude.ai or ChatGPT skill settings."
